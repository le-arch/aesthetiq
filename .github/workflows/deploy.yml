name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies (if any)
      run: |
        if [ -f "package.json" ]; then
          npm ci
        fi

    - name: Run HTML validation
      uses: cycjimmy/semantic-release-action@v3
      with:
        extra_plugins: |
          @semantic-release/exec
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for broken links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/md-link-check-config.json'
      if: always()

  lint:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: HTML Validation
      uses: anishathalye/proof-html@v2
      with:
        directory: .
        config: .htmlvalidate.json

    - name: CSS Linting
      uses: actionshub/stylelint@v2
      with:
        args: '**/*.css'
      if: contains(github.event.pull_request.title, 'css') || contains(github.event.pull_request.body, 'css')

    - name: JavaScript Linting
      uses: actionshub/eslint@v2
      with:
        args: '**/*.js'
      if: contains(github.event.pull_request.title, 'js') || contains(github.event.pull_request.body, 'js')

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Minify assets (optional)
      run: |
        # Install minification tools
        npm install -g uglify-js clean-css-cli html-minifier
        
        # Minify JavaScript files
        find . -name "*.js" -not -path "./node_modules/*" -exec uglifyjs {} -o {} \;
        
        # Minify CSS files
        find . -name "*.css" -not -path "./node_modules/*" -exec cleancss -o {} {} \;
        
        # Minify HTML files
        find . -name "*.html" -not -path "./node_modules/*" -exec html-minifier {} --collapse-whitespace -o {} \;
      if: false  # Set to true if you want minification

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
