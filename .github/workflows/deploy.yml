name: Deploy Aesthetiq

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Quick validation
      run: |
        echo "🔍 Quick check for aesthetiq..."
        [ -f "index.html" ] && echo "✅ index.html found" || echo "❌ ERROR: No index.html"
        [ -f "style.css" ] && echo "✅ style.css found" || echo "⚠️  style.css not found (optional)"
        echo "📁 Total files: $(find . -type f | wc -l)"
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'
    
    - name: Deploy
      uses: actions/deploy-pages@v4
    
    - name: Success
      run: |
        echo "🎉 aesthetiq deployed!"
        echo "🌐 Visit: https://le-arch.github.io/aesthetiq/"
        echo "⏱️  Available in 1-2 minutes..."
