name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for link checking

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies (if any)
      run: |
        if [ -f "package.json" ]; then
          npm ci
        else
          echo "No package.json found, skipping npm install"
        fi

    - name: Basic HTML validation
      run: |
        echo "Running basic validation..."
        
        # Check for required files
        if [ ! -f "index.html" ]; then
          echo "WARNING: No index.html found in root"
        else
          echo "✅ Found index.html"
          # Quick HTML5 validation
          if command -v python3 &> /dev/null; then
            python3 -c "
from html.parser import HTMLParser
import sys

class SimpleHTMLValidator(HTMLParser):
    def __init__(self):
        super().__init__()
        self.errors = []
    
    def handle_starttag(self, tag, attrs):
        if tag == 'a':
            href = dict(attrs).get('href', '')
            if href == '':
                self.errors.append('Empty href found')
    
    def handle_endtag(self, tag):
        pass

with open('index.html', 'r') as f:
    content = f.read()
    parser = SimpleHTMLValidator()
    parser.feed(content)
    if parser.errors:
        print('HTML issues found:', parser.errors)
            " || echo "Basic HTML check completed"
          fi
        fi
        
        # Count files for debugging
        echo "Project contains:"
        echo "- HTML files: $(find . -name "*.html" -type f | wc -l)"
        echo "- CSS files: $(find . -name "*.css" -type f | wc -l)"
        echo "- JS files: $(find . -name "*.js" -type f | wc -l)"

    - name: Check for broken links (only if markdown files exist)
      run: |
        # Check if any markdown files exist
        MD_FILES=$(find . -name "*.md" -type f | head -5)
        if [ -z "$MD_FILES" ]; then
          echo "No markdown files found, skipping link check"
          exit 0
        fi
        
        echo "Found markdown files, checking links..."
        
        # Create config file if it doesn't exist
        if [ ! -f ".github/md-link-check-config.json" ]; then
          mkdir -p .github
          echo '{
            "ignorePatterns": [
              { "pattern": "^http://localhost" },
              { "pattern": "^https://github.com/.*/issues/" },
              { "pattern": "^#" }
            ],
            "aliveStatusCodes": [200, 206, 403, 429],
            "timeout": "10s",
            "retryOn429": true,
            "retryCount": 2
          }' > .github/md-link-check-config.json
        fi
        
        # Install and run markdown-link-check
        npm install -g markdown-link-check
        for file in $MD_FILES; do
          echo "Checking links in: $file"
          markdown-link-check -c .github/md-link-check-config.json -q "$file" || true
        done
      if: always()

  lint:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: HTML Validation
      run: |
        echo "HTML Validation (if files exist)..."
        HTML_FILES=$(find . -name "*.html" -type f | head -1)
        if [ -n "$HTML_FILES" ]; then
          echo "Found HTML files"
          # Simple validation: check for unclosed tags
          if command -v xmllint &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y libxml2-utils || true
          fi
          if command -v xmllint &> /dev/null; then
            for htmlfile in $(find . -name "*.html" -type f); do
              xmllint --noout "$htmlfile" 2>/dev/null && echo "✅ $htmlfile: XML well-formed" || echo "⚠️  $htmlfile: May have XML issues"
            done
          fi
        else
          echo "No HTML files found"
        fi

    - name: CSS Syntax Check
      run: |
        echo "CSS Syntax Check..."
        CSS_FILES=$(find . -name "*.css" -type f)
        if [ -n "$CSS_FILES" ]; then
          echo "Found CSS files"
          for cssfile in $CSS_FILES; do
            # Simple CSS validation with node
            node -e "
              const fs = require('fs');
              const css = fs.readFileSync('$cssfile', 'utf8');
              // Basic check: look for obvious syntax errors
              const lines = css.split('\n');
              let inComment = false;
              let errors = [];
              
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                // Skip comments
                if (line.includes('/*')) inComment = true;
                if (line.includes('*/')) inComment = false;
                if (inComment) continue;
                
                // Check for unclosed braces (simplified)
                if ((line.match(/{/g) || []).length !== (line.match(/}/g) || []).length) {
                  // This is not perfect but catches obvious issues
                  if (!line.trim().endsWith('{') && !line.trim().startsWith('}')) {
                    errors.push(\`Line \${i+1}: Possible missing brace\`);
                  }
                }
              }
              
              if (errors.length > 0) {
                console.log('⚠️  $cssfile: Potential issues found');
                errors.forEach(err => console.log('   ' + err));
              } else {
                console.log('✅ $cssfile: Syntax appears OK');
              }
            " 2>/dev/null || echo "✅ $cssfile: Processed"
          done
        else
          echo "No CSS files found"
        fi

    - name: JavaScript Syntax Check
      run: |
        echo "JavaScript Syntax Check..."
        JS_FILES=$(find . -name "*.js" -type f ! -path "./node_modules/*")
        if [ -n "$JS_FILES" ]; then
          echo "Found JavaScript files"
          for jsfile in $JS_FILES; do
            if command -v node &> /dev/null; then
              node -c "$jsfile" && echo "✅ $jsfile: Syntax OK" || echo "❌ $jsfile: Syntax error"
            else
              echo "Node.js not available for JS validation"
            fi
          done
        else
          echo "No JavaScript files found"
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: [validate, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
