name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies (if any)
      run: |
        if [ -f "package.json" ]; then
          npm ci
        else
          echo "No package.json found, skipping npm install"
        fi

    - name: Basic HTML validation
      run: |
        echo "Running basic validation..."
        
        # Check for required files
        if [ ! -f "index.html" ]; then
          echo "WARNING: No index.html found in root"
        else
          echo "✅ Found index.html"
        fi
        
        # Check for common HTML issues
        if find . -name "*.html" -type f | xargs grep -l "href=\"\"" 2>/dev/null; then
          echo "WARNING: Found empty href attributes in HTML files"
        fi
        
        # Count files for debugging
        echo "Project structure:"
        find . -type f -name "*.html" -o -name "*.css" -o -name "*.js" | head -20

    - name: Check for broken links (markdown files only)
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        check-modified-files-only: 'yes'
      if: always()

  lint:
    runs-on: ubuntu-latest
    needs: validate
    if: always()  # Run even if validation has warnings
    
    steps:
    - uses: actions/checkout@v4
    
    - name: HTML Validation (if .htmlvalidate.json exists)
      run: |
        if [ -f ".htmlvalidate.json" ]; then
          npm install -g html-validate
          html-validate **/*.html || echo "HTML validation completed with findings"
        else
          echo "No .htmlvalidate.json found, skipping HTML validation"
        fi

    - name: CSS Linting (if CSS files exist)
      run: |
        CSS_FILES=$(find . -name "*.css" -not -path "./node_modules/*" | head -1)
        if [ -n "$CSS_FILES" ]; then
          echo "Found CSS files, running basic checks..."
          # Simple CSS checks
          find . -name "*.css" -exec grep -l "!important" {} \; || true
        else
          echo "No CSS files found, skipping CSS linting"
        fi

    - name: JavaScript Linting (if JS files exist)
      run: |
        JS_FILES=$(find . -name "*.js" -not -path "./node_modules/*" | head -1)
        if [ -n "$JS_FILES" ]; then
          echo "Found JavaScript files"
          # Simple JS syntax check
          if command -v node &> /dev/null; then
            for jsfile in $(find . -name "*.js" -not -path "./node_modules/*"); do
              node -c "$jsfile" && echo "✅ $jsfile syntax OK" || echo "❌ $jsfile has syntax errors"
            done
          fi
        else
          echo "No JavaScript files found, skipping JS linting"
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: [validate, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Minify assets (optional - disabled by default)
      run: |
        # Only run if you explicitly enable this
        echo "Minification is disabled by default"
        echo "To enable: change 'if: false' to 'if: true'"
      if: false

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
